<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Explorer</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <h1>🌍 Travel Explorer</h1>
    </header>

    <main>

        <section class="hero">
            <h2>Descobre o teu próximo destino</h2>
            <p>Pesquisa cidades e explora informações úteis em tempo real.</p>

            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Pesquisar cidade...">
                <button id="searchBtn">Pesquisar</button>
            </div>
        </section>

        <section class="results" id="results">
            <h3>Informações do destino</h3>

            <div class="card">
                <p>Os resultados da pesquisa irão aparecer aqui.</p>
            </div>
        </section>

    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
